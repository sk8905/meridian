<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#141414">
  <script>
    // Resolve the stored theme choice BEFORE first paint (no flash), exactly as
    // the current app does — one inline script, no dependency.
    (function(){var r=document.documentElement;var mq=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)");var sd=mq&&mq.matches;var p;try{p=localStorage.getItem("m_theme_pref");}catch(e){}if(p!=="system"&&p!=="light"&&p!=="dark"){p=(p==="other")?(sd?"light":"dark"):"system";}var t=p==="system"?(sd?"dark":"light"):p;r.setAttribute("data-theme",t);r.setAttribute("data-theme-choice",p);var dz;try{dz=localStorage.getItem("m_density");}catch(e){}r.setAttribute("data-density",dz==="comfortable"?"comfortable":"compact");var fa;try{fa=parseFloat(localStorage.getItem("m_fs_adj"));}catch(e){}if(fa===fa&&isFinite(fa)){if(fa<-1.5)fa=-1.5;if(fa>4.5)fa=4.5;r.style.setProperty("--fs-adj",fa+"px");}})();
    ["gesturestart","gesturechange","gestureend"].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault();},{passive:false});});
  </script>
  <style>html{background:#141414}</style>
  <!-- Reactive-island runtime (Phase 3). Resolves the bare specifiers in the UNBUNDLED
       source the test harness + dev server serve (node_modules sits under the served
       repo root). In the Vite build, every bare specifier is bundled into the hashed
       app chunk, so this map is never consulted — it is harmlessly inert in dist/prod. -->
  <script type="importmap">
  {
    "imports": {
      "preact": "/node_modules/preact/dist/preact.mjs",
      "preact/hooks": "/node_modules/preact/hooks/dist/hooks.mjs",
      "@preact/signals": "/node_modules/@preact/signals/dist/signals.mjs",
      "@preact/signals-core": "/node_modules/@preact/signals-core/dist/signals-core.mjs"
    }
  }
  </script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=7" />
  <meta name="apple-mobile-web-app-title" content="Wire" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>Wire</title>
  <meta name="description" content="Wire — markets, macro, credit &amp; legal, one surface" />

  <!-- The one app typeface (Gotham, self-hosted via Montserrat). Preload the latin
       file so the first paint is already in the real face — no swap flash on the
       dark terminal. @font-face lives in premium.css; latin-ext loads on demand. -->
  <link rel="preload" href="/fonts/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin />

  <!-- Shared visual language (unchanged look). All eleven stylesheets are bundled,
       minified and content-hashed by Vite via the single ./styles.css entry, in the
       same cascade order as before (feed.css last). No more hand-managed ?v= tokens. -->
  <link rel="stylesheet" href="/v2/styles.css" />

  <!-- ONE runtime, loaded once for the whole app — the router, shared chrome, the
       in-memory data cache and view lifecycles. Vite bundles + hashes it and its
       view chunks; the desk data modules stay external (loaded on demand). -->
  <script type="module" src="/v2/js/runtime.js"></script>
</head>
<body>
  <div id="wire-header"></div>
  <main id="app" class="v2-app"></main>
  <footer class="footer" id="v2-footer"></footer>
  <!-- Bottom tab bar is injected once by the runtime chrome. -->
</body>
</html>
