name: collect-wire

# The WIRE SWEEP (owner 2026-10-21, HOUSE_STYLE R52): reads the live News wire exactly as
# the Worker builds it (scripts/collect-wire.mjs — same sources, filters and 30-day window),
# finds every headline that names a tracked manager, hedge fund, law firm, LP, deal
# borrower, restructuring or Dashboard stressed credit, and keeps it in the PERMANENT queue
# backfill/wire-queue.json until the heavy-sweep routine has recorded it in its place (or
# rejected it with a reason in backfill/wire-ledger.json). Open items are never dropped.
# Runs here (open internet) every 2h; commits the queue only when it changed, [skip ci].

# GitHub's cron is best-effort (the schedule did not fire once in its first 5h, 2026-10-21),
# so the queue is ALSO refreshed on every push that changes the data or the ledger — the
# routines push every ~2h, so this keeps it current even when the schedule is skipped — and
# by the heavy-sweep routine itself before it works the queue (docs/refresh-routines.md).
# The collector's own commit uses GITHUB_TOKEN, which never re-triggers a workflow (no loop).
on:
  schedule:
    - cron: "23 */2 * * *"
    - cron: "53 1-23/2 * * *"
  push:
    branches: [main]
    paths:
      - credit/js/data.js
      - credit/js/deal-tags.js
      - legal/js/data.js
      - dashboard/js/data.js
      - backfill/wire-ledger.json
      - scripts/collect-wire.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-wire
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect
        run: |
          mkdir -p backfill
          node scripts/collect-wire.mjs > /tmp/q.json
          node -e 'const j=require("/tmp/q.json");console.log(JSON.stringify(j.summary))'
          cp /tmp/q.json backfill/wire-queue.json
      - name: Commit if changed
        run: |
          # Compare the items (not the timestamp) so a no-change run makes no commit — but
          # always commit at least every ~6h so the health check sees the collector alive.
          if git show HEAD:backfill/wire-queue.json > /tmp/prev.json 2>/dev/null && \
             node -e 'const a=require("/tmp/prev.json"),b=require(process.argv[1]);const strip=(q)=>JSON.stringify((q.items||[]).map(({lastSeen,...x})=>x));const fresh=Date.now()-Date.parse(a.generated||0)<5*3600e3;process.exit(strip(a)===strip(b)&&fresh?0:1)' "$PWD/backfill/wire-queue.json"; then
            echo "No change"; exit 0
          fi
          git config user.name "wire-collector[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backfill/wire-queue.json
          s=$(node -e 'const s=require(process.argv[1]).summary;console.log(`${s.open} open of ${s.total}`)' "$PWD/backfill/wire-queue.json")
          git commit -m "collector: backfill/wire-queue.json — $s [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "push failed after retries"; exit 1
