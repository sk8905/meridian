name: collect-rx

# Candidates for legal `restructurings` (English Part 26A plans + Part 26 creditor
# schemes that reached court), by scripts/collect-rx.mjs: The National Archives Find Case
# Law judgments (each confirmed as Part 26/26A from its own text), plus South Square
# judgment notes and GRR topic pages as leads. Output: backfill/rx-candidates.json — a
# worklist the refresh / heavy-sweep routines verify and record; nothing is applied to
# the data files here. Committed only when the candidate set changes.
#
#   daily 03:37 UTC + manual dispatch

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-rx
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect restructuring candidates
        run: |
          mkdir -p backfill
          node scripts/collect-rx.mjs > /tmp/rx.json
          node -e 'const j=require("/tmp/rx.json");console.log(JSON.stringify(j.summary))'
          cp /tmp/rx.json backfill/rx-candidates.json

      - name: Commit if changed
        run: |
          if git show HEAD:backfill/rx-candidates.json > /tmp/prev.json 2>/dev/null && \
             node -e 'const a=require("/tmp/prev.json"),b=require(process.argv[1]);const k=(j)=>JSON.stringify([j.judgments,j.leads]);process.exit(k(a)===k(b)?0:1)' "$PWD/backfill/rx-candidates.json"; then
            echo "No change"; exit 0
          fi
          git config user.name "wire-collector[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backfill/rx-candidates.json
          git commit -m "collector: backfill/rx-candidates.json — $(node -e 'const s=require(process.argv[1]).summary;console.log(s.judgments+" new judgments / "+s.leads+" leads")' "$PWD/backfill/rx-candidates.json") [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
