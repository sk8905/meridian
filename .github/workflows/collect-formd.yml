name: collect-formd

# Form D filings of the tracked funds (SEC EDGAR) by scripts/collect-formd.mjs — exactly-named filers only; CANDIDATES for the profile rota (fundFormD), never applied here.
# Data audit 2026-10-21. backfill/ is excluded from the deployed site; committed only
# when it changed, [skip ci].
#
#   weekly (cron "17 5 * * 2" UTC) + manual dispatch

on:
  schedule:
    - cron: "17 5 * * 2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-formd
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect
        run: |
          mkdir -p backfill
          node scripts/collect-formd.mjs > /tmp/out.json
          cp /tmp/out.json backfill/formd.json

      - name: Commit if changed
        run: |
          if git show HEAD:backfill/formd.json > /tmp/prev.json 2>/dev/null && \
             node -e 'const a=require("/tmp/prev.json"),b=require(process.argv[1]);delete a.generated;delete b.generated;process.exit(JSON.stringify(a)===JSON.stringify(b)?0:1)' "$PWD/backfill/formd.json"; then
            echo "No change"; exit 0
          fi
          git config user.name "wire-collector[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backfill/formd.json
          git commit -m "collector: backfill/formd.json — Form D $(node -e 'const j=require(process.argv[1]);console.log(matched+" funds with a filer / "+j.searched+" searched")' "$PWD/backfill/formd.json") [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
