name: collect-gleif

# LEI candidates for the tracked credit managers and funds from GLEIF's public API
# (CC0 1.0 — no key), by scripts/collect-gleif.mjs. Runs here because api.gleif.org is
# blocked from the refresh routines' containers. Output: backfill/gleif.json —
# CANDIDATES only (a name match is not identity); a routine or the owner confirms
# jurisdiction / parent before an `lei` is written to credit/js/data.js.
# backfill/ is excluded from the deployed site; committed only when it changed, [skip ci].
#
#   weekly Mon 04:29 UTC (LEIs change slowly) + manual dispatch

on:
  schedule:
    - cron: "29 4 * * 1"
  workflow_dispatch:
    inputs:
      kind:
        description: "managers | funds | all"
        required: false
        default: "all"

permissions:
  contents: write

concurrency:
  group: collect-gleif
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect LEI candidates
        run: |
          mkdir -p backfill
          node scripts/collect-gleif.mjs --kind="${{ inputs.kind || 'all' }}" > /tmp/gleif.json
          node -e 'const j=require("/tmp/gleif.json");console.log(JSON.stringify(j.summary))'
          cp /tmp/gleif.json backfill/gleif.json

      - name: Commit if changed
        run: |
          if git show HEAD:backfill/gleif.json > /tmp/prev.json 2>/dev/null && \
             node -e 'const a=require("/tmp/prev.json"),b=require(process.argv[1]);process.exit(JSON.stringify(a.entities)===JSON.stringify(b.entities)?0:1)' "$PWD/backfill/gleif.json"; then
            echo "No change"; exit 0
          fi
          git config user.name "wire-collector[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backfill/gleif.json
          git commit -m "collector: backfill/gleif.json — LEI candidates $(node -e 'const j=require(process.argv[1]);const s=j.summary;console.log(s.singleExact+" exact / "+s.queried+" queried")' "$PWD/backfill/gleif.json") [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
