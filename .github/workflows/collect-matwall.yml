name: collect-matwall

# Leads for re-sourcing the Dashboard maturity wall (MATWALL.europe first) —
# scripts/collect-matwall.mjs: recent European maturity-wall headlines (Google News
# RSS) plus the maturity-schedule lines of the free official PDFs (S&P UBS Western
# European Leveraged Loan Index dashboard, AFME's quarterly HY / leveraged loan
# report). Runs here because the routines' containers can't reach those hosts.
# Output: backfill/matwall-sources.json (not deployed), committed with [skip ci] only
# when it changed. The refresh routine verifies a lead before changing any figure.

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-matwall
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pdftotext
        run: sudo apt-get install -y -qq poppler-utils >/dev/null || echo "poppler-utils unavailable"
      - name: Collect
        run: |
          mkdir -p backfill
          node scripts/collect-matwall.mjs > /tmp/out.json
          cp /tmp/out.json backfill/matwall-sources.json
      - name: Commit if changed
        run: |
          if git show HEAD:backfill/matwall-sources.json > /tmp/prev.json 2>/dev/null && \
             node -e 'const p=require("/tmp/prev.json"),c=require(process.argv[1]);const k=(j)=>JSON.stringify([j.leads,(j.docs||[]).map(d=>[d.fetched,d.lines])]);process.exit(k(p)===k(c)?0:1)' "$PWD/backfill/matwall-sources.json"; then
            echo "No change"; exit 0
          fi
          git config user.name "wire-collector[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backfill/matwall-sources.json
          n=$(node -e 'const j=require(process.argv[1]);console.log(j.leads.filter(l=>l.newer).length)' "$PWD/backfill/matwall-sources.json")
          git commit -m "collector: backfill/matwall-sources.json — $n new maturity-wall leads [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "push failed after retries"; exit 1
