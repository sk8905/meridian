name: tests

# Advisory CI — NOT a deploy gate.
#
# Cloudflare Workers Builds deploys Wire straight off a push to `main` (it runs
# `npm run build` only), and a GitHub Action cannot block that git-connected
# deploy. So this workflow's job is to make "test before deploy" VISIBLE rather
# than honour-system: it runs the full suite on every push to `main`, goes red
# and notifies on the commit when something breaks, and lets a human react. It
# does not stop the deploy — it is the safety net that tells you a bad one shipped.
#
# It runs the suite twice, matching CLAUDE.md's own recipe: once against source,
# then once against the Vite-built `dist/` to prove the built output serves
# identically.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The suite drives ~23 specs through a real headless Chromium. Playwright
      # is deliberately NOT a package.json dependency (the dev container and this
      # remote env both ship it pre-installed at a global path); on a stock runner
      # we install it ourselves, pinned to the version those envs use (1.56.1), so
      # CI and local behave identically. WIRE_PW then points tests/lib.mjs at it;
      # Chromium resolves from Playwright's default browsers path.
      - name: Install Playwright + Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Full suite (source)
        env:
          WIRE_PW: ${{ github.workspace }}/node_modules/playwright/index.js
        run: node tests/run.mjs

      - name: Build (Vite pipeline, same as the deploy)
        run: npm run build

      - name: Full suite (built dist/)
        env:
          WIRE_PW: ${{ github.workspace }}/node_modules/playwright/index.js
        run: TEST_ROOT=dist node tests/run.mjs
