name: collect-manager-news

# Credit managers' OWN news / press pages, read from their own websites (sitemaps +
# each page's own metadata) by scripts/collect-manager-news.mjs — the same reader as
# the law-firm collector (robots.txt honoured, polite pacing). Runs here because the
# refresh routines' containers can't reach most manager sites. Output lands in
# backfill/manager-news.json (excluded from the deployed site), committed to main only
# when it changed, with [skip ci]. The heavy-sweep routine records from it.
#
#   every 4h        → last 14 days, ≤20 pages per manager
#   manual dispatch → same

on:
  schedule:
    - cron: "53 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-manager-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect
        run: |
          mkdir -p backfill
          node scripts/collect-manager-news.mjs --since=14d --max=20 > /tmp/out.json
          node -e 'const j=require("/tmp/out.json");const ok=Object.values(j.managers).filter(s=>s.sitemaps>0).length;console.log(`${j.items.length} items, ${ok}/${Object.keys(j.managers).length} managers with a readable sitemap`)'
          cp /tmp/out.json backfill/manager-news.json
      - name: Commit if changed
        run: |
          if git show HEAD:backfill/manager-news.json > /tmp/prev.json 2>/dev/null && \
             node -e 'const a=require("/tmp/prev.json").items,b=require(process.argv[1]).items;process.exit(JSON.stringify(a)===JSON.stringify(b)?0:1)' "$PWD/backfill/manager-news.json"; then
            echo "No change"; exit 0
          fi
          git config user.name "wire-collector[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backfill/manager-news.json
          n=$(node -e 'console.log(require(process.argv[1]).items.length)' "$PWD/backfill/manager-news.json")
          git commit -m "collector: backfill/manager-news.json — $n manager publications [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "push failed after retries"; exit 1
